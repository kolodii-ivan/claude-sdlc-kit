name: Claude SDLC — Iterate

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: { required: true }
      VERCEL_TOKEN:             { required: false }
      VERCEL_PROJECT_ID:        { required: false }
      VERCEL_AUTOMATION_BYPASS_SECRET: { required: false }
      NEXT_PUBLIC_SUPABASE_URL: { required: false }
      NEXT_PUBLIC_SUPABASE_ANON_KEY: { required: false }
      SUPABASE_SERVICE_ROLE_KEY: { required: false }

concurrency:
  group: claude-max
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      issues: read
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
      mode: ${{ steps.decide.outputs.mode }}
      pr_number: ${{ steps.decide.outputs.pr_number }}
      branch: ${{ steps.decide.outputs.branch }}
      issue_number: ${{ steps.decide.outputs.issue_number }}
    steps:
      - name: Decide whether to run
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_PR_COMMENT: ${{ github.event.issue.pull_request != null }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association || github.event.sender.login }}
          PR_AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          SENDER_TYPE: ${{ github.event.sender.type }}
          LABEL_NAME: ${{ github.event.label.name }}
          ISSUE_LABELS_JSON: ${{ toJSON(github.event.issue.labels) }}
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels) }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Skip bot-authored events (prevents recursion)
          if [ "$SENDER_TYPE" = "Bot" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # Skip if no-claude label is anywhere in scope
          if echo "$ISSUE_LABELS_JSON $PR_LABELS_JSON" | grep -q '"no-claude"'; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          if [ "$EVENT_NAME" = "issue_comment" ]; then
            # Must be a comment on a PR (not a regular issue)
            if [ "$IS_PR_COMMENT" != "true" ]; then
              echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            # Must start with @claude (after trimming leading whitespace)
            TRIMMED=$(printf '%s' "$COMMENT_BODY" | sed -E 's/^[[:space:]]+//')
            case "$TRIMMED" in
              "@claude "*|"@claude") ;;
              *) echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
            esac
            # Author-association check (collaborator+)
            case "$AUTHOR_ASSOCIATION" in
              OWNER|MEMBER|COLLABORATOR) ;;
              *) echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
            esac
            PR_NUMBER="${{ github.event.issue.number }}"
            ISSUE_NUMBER="$PR_NUMBER"
            MODE="respond"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            # Must be the changes label
            if [ "$LABEL_NAME" != "needs-changes" ]; then
              echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            case "$PR_AUTHOR_ASSOCIATION" in
              OWNER|MEMBER|COLLABORATOR) ;;
              *) echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
            esac
            PR_NUMBER="${{ github.event.pull_request.number }}"
            ISSUE_NUMBER="$PR_NUMBER"
            MODE="address-feedback"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # Resolve PR head ref via gh — works for both event types
          BRANCH=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefName --jq '.headRefName')
          if [ -z "$BRANCH" ] || [ "$BRANCH" = "null" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          echo "proceed=true" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"

  iterate:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: write   # required for gh run cancel in the early-exit path
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MODE: ${{ needs.gate.outputs.mode }}
      PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
      BRANCH: ${{ needs.gate.outputs.branch }}
      ISSUE_NUMBER: ${{ needs.gate.outputs.issue_number }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      COMMENT_BODY: ${{ github.event.comment.body }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.gate.outputs.branch }}

      - name: Fetch kit helper scripts
        uses: actions/checkout@v4
        with:
          repository: kolodii-ivan/claude-sdlc-kit
          ref: v1
          path: .kit
          sparse-checkout: .github/actions/claude-sdlc-config/scripts
          sparse-checkout-cone-mode: false

      - uses: kolodii-ivan/claude-sdlc-kit/.github/actions/claude-sdlc-config@v1

      - name: Configure git identity
        run: |
          set -euo pipefail
          git config user.email "pothuyjohn@gmail.com"
          git config user.name "claude-sdlc-bot"

      - name: Resolve spec path (best-effort)
        id: spec
        run: |
          set -euo pipefail
          # Try to find a spec referencing GH-<issue>; safe to be empty
          SPEC=$(ls docs/superpowers/specs/*-gh${ISSUE_NUMBER}-*-design.md 2>/dev/null | head -n1 || true)
          echo "path=$SPEC" >> "$GITHUB_OUTPUT"

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Enforce iteration cap
        id: cap
        run: |
          set -euo pipefail
          COUNTER_FILE=".claude/iterate-iterations"
          COUNT=0
          if [ -f "$COUNTER_FILE" ]; then
            COUNT=$(cat "$COUNTER_FILE")
          fi
          COUNT=$((COUNT + 1))
          echo "$COUNT" > "$COUNTER_FILE"
          if [ "$COUNT" -gt "$LIMIT_MAX_ITERATIONS" ]; then
            gh pr comment "$PR_NUMBER" --body "Iterate cap of $LIMIT_MAX_ITERATIONS reached on this branch. Labeling \`$TRIGGER_STUCK_LABEL\` for human attention."
            gh pr edit "$PR_NUMBER" --add-label "$TRIGGER_STUCK_LABEL"
            exit 1
          fi
          git add "$COUNTER_FILE"
          git commit -m "wip: Iterate run $COUNT of $LIMIT_MAX_ITERATIONS | GH-$ISSUE_NUMBER #comment"
          source .kit/.github/actions/claude-sdlc-config/scripts/rebind-auth.sh
          rebind_git_auth
          git push -u origin "$BRANCH"

      - name: Build Mode A context (instruction)
        if: env.MODE == 'respond'
        run: |
          set -euo pipefail
          mkdir -p /tmp/claude
          INSTRUCTION=$(printf '%s' "$COMMENT_BODY" | sed -E 's/^[[:space:]]*@claude[[:space:]]*//')
          printf '%s' "$INSTRUCTION" > /tmp/claude/instruction.md
          if [ ! -s /tmp/claude/instruction.md ]; then
            gh pr comment "$PR_NUMBER" --body "Empty \`@claude\` instruction. Nothing to do."
            exit 1
          fi

      - name: Build Mode B context (review threads)
        if: env.MODE == 'address-feedback'
        run: |
          set -euo pipefail
          mkdir -p /tmp/claude
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY##*/}"
          gh api graphql -F owner="$OWNER" -F repo="$REPO" -F pr="$PR_NUMBER" -f query='
            query($owner:String!, $repo:String!, $pr:Int!) {
              repository(owner: $owner, name: $repo) {
                pullRequest(number: $pr) {
                  reviewThreads(first: 50) {
                    nodes {
                      id
                      isResolved
                      path
                      line
                      comments(first: 20) {
                        nodes { body, author { login } }
                      }
                    }
                  }
                }
              }
            }' \
            | jq '.data.repository.pullRequest.reviewThreads.nodes
                  | map(select(.isResolved == false))' \
            > /tmp/claude/review-threads.json
          THREAD_COUNT=$(jq 'length' /tmp/claude/review-threads.json)
          if [ "$THREAD_COUNT" = "0" ]; then
            gh pr edit "$PR_NUMBER" --remove-label "$TRIGGER_CHANGES_LABEL"
            gh pr comment "$PR_NUMBER" --body "No unresolved review threads found. Removed \`$TRIGGER_CHANGES_LABEL\` label."
            echo "NOTHING_TO_DO=true" >> "$GITHUB_ENV"
          fi

      - name: Exit early if nothing to do
        if: env.NOTHING_TO_DO == 'true'
        run: |
          set -euo pipefail
          # `exit 0` only exits the step's shell, not the job. Use gh run cancel
          # to actually stop downstream steps (Claude action, verify, e2e, etc).
          gh run cancel "$GITHUB_RUN_ID"
          # Sleep so the cancel signal propagates before the runner moves on.
          sleep 60
          exit 0

      - name: Read iterate prompt
        id: iterate_prompt
        run: |
          set -euo pipefail
          PROMPT_FILE=".claude/prompts/respond.md"
          if [ "$MODE" = "address-feedback" ]; then
            PROMPT_FILE=".claude/prompts/address-feedback.md"
          fi
          {
            echo 'content<<CLAUDE_PROMPT_EOF'
            cat "$PROMPT_FILE"
            echo 'CLAUDE_PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Claude — iterate
        id: claude_iterate
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          allowed_bots: "*"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: --max-turns 100 --allowed-tools "Read,Write,Edit,Glob,Grep,Skill,TodoWrite,Agent,Bash"
          plugin_marketplaces: |
            https://github.com/anthropics/claude-plugins-official.git
          plugins: |
            superpowers@claude-plugins-official
          prompt: ${{ steps.iterate_prompt.outputs.content }}
        env:
          INSTRUCTION_PATH: /tmp/claude/instruction.md
          REVIEW_THREADS_PATH: /tmp/claude/review-threads.json
          SPEC_PATH: ${{ steps.spec.outputs.path }}
          BRANCH_NAME: ${{ env.BRANCH }}
          PR_NUMBER: ${{ env.PR_NUMBER }}

      - name: Escalate if Claude iterate errored
        if: steps.claude_iterate.outcome == 'failure'
        run: |
          set -euo pipefail
          BODY="Iterate-phase Claude action exited with error (likely max-turns). Labeling \`$TRIGGER_STUCK_LABEL\`."
          if [ -f /tmp/claude/hypothesis.md ]; then
            HYPO=$(cat /tmp/claude/hypothesis.md)
            BODY="$BODY"$'\n\n''Hypothesis from agent:'$'\n\n'"$HYPO"
          fi
          gh pr comment "$PR_NUMBER" --body "$BODY"
          gh pr edit "$PR_NUMBER" --add-label "$TRIGGER_STUCK_LABEL"
          exit 1

      - name: Push iterate commits
        run: |
          set -euo pipefail
          # Auto-stage any plan/spec docs Claude wrote but forgot to commit.
          git add -A docs/superpowers/plans/ docs/superpowers/specs/ 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "docs: Auto-staged auxiliary plan/spec from Claude session | GH-${ISSUE_NUMBER} #time 1m"
          fi
          DIRTY=$(git status --porcelain | grep -v "^?? \.kit/" || true)
          if [ -n "$DIRTY" ]; then
            DIFF_STAT=$(git diff --stat HEAD 2>/dev/null || echo "(no diff)")
            echo "::group::Dirty tree contents"
            printf '%s\n' "$DIRTY"
            echo "----- diff stat -----"
            printf '%s\n' "$DIFF_STAT"
            echo "::endgroup::"
            gh pr comment "$PR_NUMBER" --body "$(printf 'Iterate phase exited with uncommitted changes:\n\n```\n%s\n```\n\n```\n%s\n```\n\nLabeling `%s`.' "$DIRTY" "$DIFF_STAT" "$TRIGGER_STUCK_LABEL")"
            gh pr edit "$PR_NUMBER" --add-label "$TRIGGER_STUCK_LABEL"
            exit 1
          fi
          source .kit/.github/actions/claude-sdlc-config/scripts/rebind-auth.sh
          rebind_git_auth
          git push -u origin "$BRANCH"

      - name: Verify local — attempt 1
        id: verify_1
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p /tmp/claude
          for CMD_NAME in TYPECHECK LINT UNIT_TESTS; do
            VAR="VERIFY_${CMD_NAME}"
            CMD="${!VAR}"
            LOG="/tmp/claude/verify-${CMD_NAME}.log"
            if ! eval "$CMD" >"$LOG" 2>&1; then
              echo "FAILED_LOG=$LOG" >> "$GITHUB_ENV"
              echo "failed=true" >> "$GITHUB_OUTPUT"
              tail -50 "$LOG"
              exit 1
            fi
          done
          echo "failed=false" >> "$GITHUB_OUTPUT"

      - name: Read debug prompt (local)
        if: steps.verify_1.outputs.failed == 'true'
        id: debug_prompt_local
        run: |
          set -euo pipefail
          {
            echo 'content<<CLAUDE_PROMPT_EOF'
            cat .claude/prompts/debug.md
            echo 'CLAUDE_PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Claude — debug local verification
        if: steps.verify_1.outputs.failed == 'true'
        id: claude_debug_local
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          allowed_bots: "*"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: --max-turns 60 --allowed-tools "Read,Write,Edit,Glob,Grep,Skill,TodoWrite,Bash"
          plugin_marketplaces: |
            https://github.com/anthropics/claude-plugins-official.git
          plugins: |
            superpowers@claude-plugins-official
          prompt: ${{ steps.debug_prompt_local.outputs.content }}
        env:
          FAILURE_LOG_PATH: ${{ env.FAILED_LOG }}
          BRANCH_NAME: ${{ env.BRANCH }}

      - name: Escalate if Claude debug (local) errored
        if: steps.claude_debug_local.outcome == 'failure'
        run: |
          set -euo pipefail
          BODY="Local-debug Claude action exited with error (likely max-turns). Labeling \`$TRIGGER_STUCK_LABEL\`."
          if [ -f /tmp/claude/hypothesis.md ]; then
            HYPO=$(cat /tmp/claude/hypothesis.md)
            BODY="$BODY"$'\n\n''Hypothesis from agent:'$'\n\n'"$HYPO"
          fi
          gh pr comment "$PR_NUMBER" --body "$BODY"
          gh pr edit "$PR_NUMBER" --add-label "$TRIGGER_STUCK_LABEL"
          exit 1

      - name: Push debug commits (local)
        if: steps.verify_1.outputs.failed == 'true'
        run: |
          set -euo pipefail
          DIRTY=$(git status --porcelain | grep -v "^?? \.kit/" || true)
          if [ -n "$DIRTY" ]; then
            DIFF_STAT=$(git diff --stat HEAD 2>/dev/null || echo "(no diff)")
            gh pr comment "$PR_NUMBER" --body "$(printf 'Debug agent exited with uncommitted changes:\n\n```\n%s\n```\n\n```\n%s\n```\n\nLabeling `%s`.' "$DIRTY" "$DIFF_STAT" "$TRIGGER_STUCK_LABEL")"
            gh pr edit "$PR_NUMBER" --add-label "$TRIGGER_STUCK_LABEL"
            exit 1
          fi
          source .kit/.github/actions/claude-sdlc-config/scripts/rebind-auth.sh
          rebind_git_auth
          git push -u origin "$BRANCH"

      - name: Verify local — attempt 2 (final)
        if: steps.verify_1.outputs.failed == 'true'
        run: |
          set -euo pipefail
          for CMD_NAME in TYPECHECK LINT UNIT_TESTS; do
            VAR="VERIFY_${CMD_NAME}"
            CMD="${!VAR}"
            LOG="/tmp/claude/verify-${CMD_NAME}.log"
            if ! eval "$CMD" >"$LOG" 2>&1; then
              echo "::error::$CMD_NAME failed on attempt 2"
              echo "----- $LOG (last 50 lines) -----"
              tail -50 "$LOG"
              echo "----- end of log -----"
              FAIL_TAIL=$(tail -50 "$LOG")
              gh pr comment "$PR_NUMBER" --body "$(printf 'Local verification still failing after debug attempt: **%s**\n\n```\n%s\n```\n\nLabeling `%s`.' "$CMD_NAME" "$FAIL_TAIL" "$TRIGGER_STUCK_LABEL")"
              gh pr edit "$PR_NUMBER" --add-label "$TRIGGER_STUCK_LABEL"
              exit 1
            fi
          done

      - name: Capture branch SHA before preview
        id: sha_pre_preview
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Preview wait
        id: preview
        uses: kolodii-ivan/claude-sdlc-kit/.github/actions/preview-wait-vercel@v1
        with:
          commit_sha: ${{ steps.sha_pre_preview.outputs.sha }}
          timeout_min: ${{ env.PREVIEW_WAIT_TIMEOUT }}

      - name: Decide e2e mode
        id: e2e_mode
        run: |
          set -euo pipefail
          READY="${{ steps.preview.outputs.ready }}"
          PREVIEW_URL="${{ steps.preview.outputs.preview_url }}"
          if [ "$READY" = "true" ]; then
            echo "mode=preview" >> "$GITHUB_OUTPUT"
            echo "base_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          elif [ "$READY" = "skipped" ] && [ "$VERIFY_E2E_NEEDS_PREVIEW" = "true" ]; then
            gh pr comment "$PR_NUMBER" --body "Preview provider is none but config requires preview for e2e. Labeling \`$TRIGGER_STUCK_LABEL\`."
            gh pr edit "$PR_NUMBER" --add-label "$TRIGGER_STUCK_LABEL"
            exit 1
          elif [ "$READY" = "skipped" ]; then
            echo "mode=localhost" >> "$GITHUB_OUTPUT"
            echo "base_url=http://localhost:3000" >> "$GITHUB_OUTPUT"
          else
            gh pr comment "$PR_NUMBER" --body "Preview wait failed (ready=$READY). Labeling \`$TRIGGER_STUCK_LABEL\`."
            gh pr edit "$PR_NUMBER" --add-label "$TRIGGER_STUCK_LABEL"
            exit 1
          fi

      - name: Run e2e — attempt 1
        id: e2e_1
        continue-on-error: true
        run: |
          set -uo pipefail
          MODE="${{ steps.e2e_mode.outputs.mode }}"
          BASE_URL="${{ steps.e2e_mode.outputs.base_url }}"
          if [ "$MODE" = "localhost" ]; then
            npm run build
            nohup npm start >/tmp/claude/local-server.log 2>&1 &
            echo $! > /tmp/claude/local-server.pid
            for _ in $(seq 1 30); do
              if curl -sSf http://localhost:3000 >/dev/null 2>&1; then break; fi
              sleep 2
            done
          fi
          if PLAYWRIGHT_TEST_BASE_URL="$BASE_URL" $VERIFY_E2E_TESTS \
              >/tmp/claude/verify-E2E.log 2>&1; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            tail -100 /tmp/claude/verify-E2E.log
            echo "FAILED_LOG=/tmp/claude/verify-E2E.log" >> "$GITHUB_ENV"
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -f /tmp/claude/local-server.pid ]; then
            kill "$(cat /tmp/claude/local-server.pid)" 2>/dev/null || true
          fi
          echo "base_url=$BASE_URL" >> "$GITHUB_OUTPUT"

      - name: Read debug prompt (e2e)
        if: steps.e2e_1.outputs.failed == 'true'
        id: debug_prompt_e2e
        run: |
          set -euo pipefail
          {
            echo 'content<<CLAUDE_PROMPT_EOF'
            cat .claude/prompts/debug.md
            echo 'CLAUDE_PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Claude — debug e2e
        if: steps.e2e_1.outputs.failed == 'true'
        id: claude_debug_e2e
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          allowed_bots: "*"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: --max-turns 60 --allowed-tools "Read,Write,Edit,Glob,Grep,Skill,TodoWrite,Bash"
          plugin_marketplaces: |
            https://github.com/anthropics/claude-plugins-official.git
          plugins: |
            superpowers@claude-plugins-official
          prompt: ${{ steps.debug_prompt_e2e.outputs.content }}
        env:
          FAILURE_LOG_PATH: ${{ env.FAILED_LOG }}
          BRANCH_NAME: ${{ env.BRANCH }}

      - name: Escalate if Claude debug (e2e) errored
        if: steps.claude_debug_e2e.outcome == 'failure'
        run: |
          set -euo pipefail
          BODY="E2E-debug Claude action exited with error (likely max-turns). Labeling \`$TRIGGER_STUCK_LABEL\`."
          if [ -f /tmp/claude/hypothesis.md ]; then
            HYPO=$(cat /tmp/claude/hypothesis.md)
            BODY="$BODY"$'\n\n''Hypothesis from agent:'$'\n\n'"$HYPO"
          fi
          gh pr comment "$PR_NUMBER" --body "$BODY"
          gh pr edit "$PR_NUMBER" --add-label "$TRIGGER_STUCK_LABEL"
          exit 1

      - name: Push e2e debug commits
        if: steps.e2e_1.outputs.failed == 'true'
        run: |
          set -euo pipefail
          DIRTY=$(git status --porcelain | grep -v "^?? \.kit/" || true)
          if [ -n "$DIRTY" ]; then
            DIFF_STAT=$(git diff --stat HEAD 2>/dev/null || echo "(no diff)")
            gh pr comment "$PR_NUMBER" --body "$(printf 'Debug agent (e2e) exited with uncommitted changes:\n\n```\n%s\n```\n\n```\n%s\n```\n\nLabeling `%s`.' "$DIRTY" "$DIFF_STAT" "$TRIGGER_STUCK_LABEL")"
            gh pr edit "$PR_NUMBER" --add-label "$TRIGGER_STUCK_LABEL"
            exit 1
          fi
          source .kit/.github/actions/claude-sdlc-config/scripts/rebind-auth.sh
          rebind_git_auth
          git push -u origin "$BRANCH"

      - name: Capture branch SHA after debug push
        if: steps.e2e_1.outputs.failed == 'true'
        id: sha_after_debug
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Re-wait preview after fix
        if: steps.e2e_1.outputs.failed == 'true'
        id: preview_after_fix
        uses: kolodii-ivan/claude-sdlc-kit/.github/actions/preview-wait-vercel@v1
        with:
          commit_sha: ${{ steps.sha_after_debug.outputs.sha }}
          timeout_min: ${{ env.PREVIEW_WAIT_TIMEOUT }}

      - name: Run e2e — attempt 2 (final)
        if: steps.e2e_1.outputs.failed == 'true'
        id: e2e_2
        run: |
          set -euo pipefail
          BASE_URL="${{ steps.preview_after_fix.outputs.preview_url }}"
          if [ -z "$BASE_URL" ]; then BASE_URL="http://localhost:3000"; fi
          if ! PLAYWRIGHT_TEST_BASE_URL="$BASE_URL" $VERIFY_E2E_TESTS \
              >/tmp/claude/verify-E2E.log 2>&1; then
            gh pr comment "$PR_NUMBER" --body "E2E still failing after debug attempt. Labeling \`$TRIGGER_STUCK_LABEL\`."
            gh pr edit "$PR_NUMBER" --add-label "$TRIGGER_STUCK_LABEL"
            exit 1
          fi
          echo "base_url=$BASE_URL" >> "$GITHUB_OUTPUT"

      - name: Compute final base URL for downstream steps
        id: final_url
        run: |
          set -euo pipefail
          URL="${{ steps.e2e_2.outputs.base_url }}"
          if [ -z "$URL" ]; then URL="${{ steps.preview.outputs.preview_url }}"; fi
          if [ -z "$URL" ]; then URL="${{ steps.e2e_1.outputs.base_url }}"; fi
          if [ -z "$URL" ]; then URL="http://localhost:3000"; fi
          echo "base_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Conditional UI screenshots
        run: |
          set -euo pipefail
          if git diff --name-only "origin/${DEFAULT_BRANCH}..HEAD" \
            | grep -E '^(src/app/|src/components/|.*\.css$)' >/dev/null; then
            mkdir -p /tmp/claude/screenshots
            node scripts/screenshot-routes.mjs \
              "${{ steps.final_url.outputs.base_url }}" \
              .claude/ui-routes.json \
              /tmp/claude/screenshots
            ARTIFACT_NAME="screenshots-iter-${PR_NUMBER}-$(date +%s)"
            echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> "$GITHUB_ENV"
          else
            echo "No UI files changed; skipping screenshots."
          fi

      - name: Upload screenshot artifact
        if: env.ARTIFACT_NAME != ''
        id: upload_screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: /tmp/claude/screenshots

      - name: Post screenshot comment
        if: env.ARTIFACT_NAME != ''
        run: |
          set -euo pipefail
          ARTIFACT_URL="${{ steps.upload_screenshots.outputs.artifact-url }}"
          PREVIEW_URL="${{ steps.final_url.outputs.base_url }}"
          # Build a comment with live preview route links + a single artifact download link.
          # GitHub doesn't serve individual PNGs inside an artifact ZIP, so embedded
          # `![](.../artifacts/foo.png)` would 404 — that's why we link to routes instead.
          {
            printf '## Visual review\n\n'
            printf 'Preview: %s\n\n' "$PREVIEW_URL"
            printf 'Routes captured (click to open on preview):\n\n'
            for route in $(jq -r '.[]' .claude/ui-routes.json); do
              printf -- '- [`%s`](%s%s)\n' "$route" "$PREVIEW_URL" "$route"
            done
            printf '\n📦 [Download screenshot artifact (.zip)](%s)\n' "$ARTIFACT_URL"
          } > /tmp/claude/screenshots/pr-comment.md
          gh pr comment "$BRANCH" --body-file /tmp/claude/screenshots/pr-comment.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/claude/screenshots/comment.md

      - name: Final verification gate
        run: |
          set -euo pipefail
          eval "$VERIFY_TYPECHECK"
          eval "$VERIFY_LINT"
          eval "$VERIFY_UNIT_TESTS"

      - name: Mode A finalizer (respond)
        if: env.MODE == 'respond'
        run: |
          set -euo pipefail
          PREVIEW_URL="${{ steps.preview.outputs.preview_url }}"
          INSTRUCTION_HEAD=$(head -c 500 /tmp/claude/instruction.md)
          gh pr comment "$PR_NUMBER" --body "$(printf 'Done. Preview: %s\n\n_Applied your request:_\n\n> %s' "${PREVIEW_URL:-localhost}" "$INSTRUCTION_HEAD")"

      - name: Mode B finalizer (address-feedback)
        if: env.MODE == 'address-feedback'
        run: |
          set -euo pipefail
          gh pr edit "$PR_NUMBER" --remove-label "$TRIGGER_CHANGES_LABEL"
          THREAD_COUNT=$(jq 'length' /tmp/claude/review-threads.json)
          PREVIEW_URL="${{ steps.preview.outputs.preview_url }}"
          gh pr comment "$PR_NUMBER" --body "$(printf 'Addressed %d unresolved review thread(s). Preview: %s. Re-review when ready.' "$THREAD_COUNT" "${PREVIEW_URL:-localhost}")"
